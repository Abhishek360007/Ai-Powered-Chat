server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-powered-chat
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.7}

app:
  chat:
    # How many previous messages (user + assistant) are remembered per conversation
    memory-window: ${CHAT_MEMORY_WINDOW:20}
    system-prompt: >
      You are Nova, a friendly and knowledgeable AI assistant.
      Give clear, accurate and concise answers. Use Markdown for formatting
      and fenced code blocks (with a language tag) for code.
      If you are unsure about something, say so instead of guessing.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
