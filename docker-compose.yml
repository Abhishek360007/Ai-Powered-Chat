services:
  # Local, free AI model server. Started only when the "ollama" profile is active
  # (COMPOSE_PROFILES=ollama in .env, which is the default).
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot job that downloads the model the first time (cached in the volume afterwards)
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${AI_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-ollama}
      AI_MODEL: ${AI_MODEL:-llama3.2:3b}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
